name: Finance model regression tests

on:
  push:
    paths:
      - index.html
      - tests/**
      - scripts/**
      - tax-updates.json
      - .github/workflows/phase0-regression.yml
  pull_request:
    paths:
      - index.html
      - tests/**
      - scripts/**
      - tax-updates.json
      - .github/workflows/phase0-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: python -m unittest discover -s tests -p 'test_aca_update_monitor.py' -v
