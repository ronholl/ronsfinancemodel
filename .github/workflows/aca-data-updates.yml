name: ACA official-data updates

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-data-updates.yml'
      - 'scripts/aca_update_monitor.py'
      - 'tests/aca-updates.test.cjs'
      - 'tests/test_aca_update_monitor.py'

permissions:
  contents: read

concurrency:
  group: aca-official-data
  cancel-in-progress: false

jobs:
  collect-and-publish:
    if: github.repository == 'ronholl/ronsfinancemodel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector before contacting sources
        run: python -m unittest discover -s tests -p 'test_aca_update_monitor.py' -v
      - name: Collect official HHS and IRS tables
        id: collect
        continue-on-error: true
        run: python scripts/aca_update_monitor.py --manifest tax-updates.json --strict
      - name: Validate all regression suites and update records
        run: node --test tests/*.test.cjs
      - name: Publish validated figures and source-check status
        run: |
          if git diff --quiet -- tax-updates.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tax-updates.json
          git commit -m "Refresh official ACA data and monitor status"
          git push origin HEAD:main
      - name: Report source problems after preserving prior figures
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'One or more official sources need review. Prior figures were retained; the app shows the monitor status.'
          exit 1
